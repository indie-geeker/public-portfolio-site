      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="220" cy="100" r="4" fill="#6C38FF" opacity="0.3" />
  <circle cx="580" cy="180" r="6" fill="#FF4785" opacity="0.4" />
